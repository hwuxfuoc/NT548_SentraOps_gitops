apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sentraops-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hwuxfuoc/NT548_SentraOps_gitops.git
    targetRevision: main
    path: helm/sentraops
    helm:
      valueFiles:
        - /dev/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sentraops-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
